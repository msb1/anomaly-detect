[package]
name = "anomaly-detect"
version = "0.1.0"
edition = "2024"
description = "Streaming anomaly-detection ingestion and windowing service"
license = "MIT"

[dependencies]
anyhow = "1"
burn = { version = "0.16", features = ["train", "wgpu"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
futures = "0.3"
nalgebra = "0.34"
rand = "0.8"
rdkafka = { version = "0.38", features = ["dynamic-linking", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
burn = { version = "0.16", features = ["ndarray"] }
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
